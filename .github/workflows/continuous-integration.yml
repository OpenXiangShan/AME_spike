# This file describes the GitHub Actions workflow for continuous integration of Spike.
#
# See
# https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions
# for API reference documentation on this file format.

name: Continuous Integration

on:
  push:
    branches:
      - ztt-v0.6-dev
  pull_request:
    branches:
      - ztt-v0.6-dev


jobs:
  test:
    name: Test Spike build (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo xargs apt-get install -y < .github/workflows/apt-packages.txt

      - name: Configure
        run: |
          mkdir -p build
          cd build
          ../configure

      - name: Build and test
        run: make -C build -j"$(nproc)" check

  test-macos:
    name: Test Spike build (MacOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Dependencies
        run: xargs brew install --overwrite < .github/workflows/brew-packages.txt

      - name: Configure
        run: |
          mkdir -p build
          cd build
          ../configure

      - name: Build
        run: make -C build -j"$(sysctl -n hw.ncpu)"
